<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zero.pub</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      width: 100%;
      padding: 1.2rem 2rem;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      user-select: none;
      display: inline-block;
    }
    .logo-zero {
      color: #ffffff;
    }
    .logo-pub {
      color: #3b82f6;
    }
    .divider {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, 
        #ffffff, 
        #3b82f6, 
        #ffffff, 
        #3b82f6, 
        #ffffff,
        #3b82f6,
        #ffffff
      );
      background-size: 800% 100%;
      animation: shimmer 20s linear infinite;
      flex-shrink: 0;
    }
    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 800% 50%;
      }
    }
    .main {
      flex: 1;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2.5rem;
    }
    .hero-title {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 2px;
      user-select: none;
    }
    .hero-title .zero {
      color: #ffffff;
    }
    .hero-title .pub {
      color: #3b82f6;
    }
    .buttons {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 0.9rem 2.4rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      background: #000000;
      border: 2px solid #3b82f6;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
      font-family: inherit;
      letter-spacing: 0.5px;
    }
    .btn:hover {
      background: #3b82f6;
      color: #000000;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: #000000;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 14px;
      padding: 2rem 2.2rem;
      min-width: 420px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.5), 0 0 60px rgba(59, 130, 246, 0.25), inset 0 0 20px rgba(59, 130, 246, 0.06);
      transform: scale(0.95);
      transition: transform 0.25s ease;
      color: #ffffff;
    }
    .modal-overlay.active .modal {
      transform: scale(1);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .modal-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .modal-title .zero {
      color: #ffffff;
    }
    .modal-title .pub {
      color: #3b82f6;
    }
    .modal-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.6rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      transition: color 0.2s ease;
      font-family: inherit;
    }
    .modal-close:hover {
      color: #ffffff;
    }
    .users-info {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    }
    .users-info strong {
      color: #3b82f6;
      font-weight: 600;
    }
    .game-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .game-item:last-child {
      border-bottom: none;
    }
    .game-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1e293b;
    }
    .game-info {
      flex: 1;
      min-width: 0;
    }
    .game-name {
      font-size: 1rem;
      font-weight: 600;
      text-transform: capitalize;
      color: #ffffff;
      margin-bottom: 0.15rem;
    }
    .game-status {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .game-status.undetected {
      color: #22c55e;
    }
    .game-status.detected {
      color: #ef4444;
    }
    .game-meta {
      text-align: right;
      font-size: 0.75rem;
      color: #64748b;
      flex-shrink: 0;
    }
    .game-players {
      color: #3b82f6;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 2rem 0;
      font-size: 0.95rem;
    }
    .error {
      text-align: center;
      color: #ef4444;
      padding: 2rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-zero">zero</span><span class="logo-pub">.pub</span>
    </div>
  </header>
  <div class="divider"></div>
  <main class="main">
    <div class="hero-title">
      <span class="zero">zero</span><span class="pub">.pub</span>
    </div>
    <div class="buttons">
      <button class="btn" type="button">Discord</button>
      <button class="btn" type="button">Buy</button>
      <button class="btn" type="button" id="statusBtn">Status</button>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">
          <span class="zero">status</span>
        </div>
        <button class="modal-close" id="modalClose" type="button">&times;</button>
      </div>
      <div id="modalContent">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const fullTitle = 'zero.pub';
    let titleIndex = 0;
    let deleting = false;
    let titleTimer = null;

    function setTitle(text) {
      document.title = text || '\u200b';
    }

    function animateTitle() {
      clearTimeout(titleTimer);
      if (!deleting) {
        titleIndex++;
        setTitle(fullTitle.slice(0, titleIndex));
        if (titleIndex === fullTitle.length) {
          deleting = true;
          titleTimer = setTimeout(animateTitle, 1500);
          return;
        }
        titleTimer = setTimeout(animateTitle, 150);
      } else {
        titleIndex--;
        setTitle(fullTitle.slice(0, titleIndex));
        if (titleIndex === 0) {
          deleting = false;
          titleTimer = setTimeout(animateTitle, 400);
          return;
        }
        titleTimer = setTimeout(animateTitle, 80);
      }
    }

    animateTitle();

    const statusBtn = document.getElementById('statusBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalClose = document.getElementById('modalClose');
    const modalContent = document.getElementById('modalContent');

    function formatDate(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diffMs = now - d;
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return diffH + 'h ago';
      const diffD = Math.floor(diffH / 24);
      return diffD + 'd ago';
    }

    async function fetchStatus() {
      const api = 'https://zero-api.htht8845.workers.dev/status';
      const proxies = [
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(api),
        'https://corsproxy.io/?' + encodeURIComponent(api),
        'https://cors.isomorphic-git.org/' + api
      ];
      for (const url of proxies) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          return await res.json();
        } catch (e) {}
      }
      throw new Error('all proxies failed');
    }

    async function loadStatus() {
      modalContent.innerHTML = '<div class="loading">Loading...</div>';
      try {
        const data = await fetchStatus();

        let html = '<div class="users-info"><strong>' + data.users + '</strong> users online</div>';

        const games = data.games || {};
        for (const key of Object.keys(games)) {
          const g = games[key];
          const statusClass = g.status === 'undetected' ? 'undetected' : 'detected';
          html += '<div class="game-item">';
          if (g.icon) {
            html += '<img class="game-icon" src="' + g.icon + '" alt="' + key + '" loading="lazy">';
          }
          html += '<div class="game-info">';
          html += '<div class="game-name">' + key + '</div>';
          html += '<div class="game-status ' + statusClass + '">' + g.status + '</div>';
          html += '</div>';
          html += '<div class="game-meta">';
          html += '<div class="game-players">' + (g.players ?? '—') + ' players</div>';
          html += '<div>' + formatDate(g.updated) + '</div>';
          html += '</div>';
          html += '</div>';
        }

        modalContent.innerHTML = html;
      } catch (e) {
        modalContent.innerHTML = '<div class="error">Failed to load status</div>';
      }
    }

    statusBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
      loadStatus();
    });

    modalClose.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
        modalOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
