<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zero.pub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-zero">zero</span><span class="logo-pub">.pub</span>
    </div>
  </header>
  <div class="divider"></div>
  <main class="main">
    <div class="hero-title">
      <span class="zero">zero</span><span class="pub">.pub</span>
    </div>
    <div class="buttons">
      <button class="btn" type="button">Discord</button>
      <button class="btn" type="button">Buy</button>
      <button class="btn" type="button" id="statusBtn">Status</button>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">
          <span class="zero">status</span>
        </div>
        <button class="modal-close" id="modalClose" type="button">&times;</button>
      </div>
      <div id="modalContent">
        <div class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
